<head>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f6fa;--card:#fff;--tx:#1b2433;--mu:#667085;--bd:#dde3ec;--ac:#1d4e9e;--act:#fff;--hd:#12356b;--bad:#c0392b;--ok:#1e8a4c}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1420;--card:#182030;--tx:#e8edf5;--mu:#9aa6b8;--bd:#2a3449;--ac:#5b9bff;--act:#0b1220;--hd:#0b1a33;--bad:#ff7a6b;--ok:#4cc884}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1420;--card:#182030;--tx:#e8edf5;--mu:#9aa6b8;--bd:#2a3449;--ac:#5b9bff;--act:#0b1220;--hd:#0b1a33;--bad:#ff7a6b;--ok:#4cc884}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Sarabun,"Noto Sans Thai",system-ui,sans-serif}
header{background:var(--hd);color:#fff;padding:14px 18px}
header h1{margin:0;font-size:18px}header p{margin:2px 0 0;font-size:12.5px;opacity:.8}
nav{display:flex;gap:6px;padding:10px 14px 0;overflow-x:auto}
nav button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:8px 8px 0 0;cursor:pointer;font:inherit;white-space:nowrap}
nav button.on{background:var(--ac);color:var(--act);border-color:var(--ac)}
nav b{font-weight:600;opacity:.75;margin-left:5px;font-size:12px}
main{padding:12px 14px 40px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:7px;padding:7px 9px;max-width:100%}
textarea{width:100%;min-height:60px}
.bar input[type=search]{flex:1;min-width:160px}
.btn{border:1px solid var(--ac);background:var(--ac);color:var(--act);padding:7px 13px;border-radius:7px;cursor:pointer;font:inherit}
.btn.g{background:var(--card);color:var(--ac)}.btn.d{background:var(--card);color:var(--bad);border-color:var(--bad)}
.btn[hidden]{display:none}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{background:var(--bg);position:sticky;top:0;color:var(--mu);font-weight:600}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--bg)}
.mu{color:var(--mu);font-size:13px}.pill{padding:1px 8px;border-radius:99px;border:1px solid var(--bd);font-size:12px}
.bd{color:var(--bad)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:20px 10px;z-index:20}
.ov[hidden]{display:none}
.md{background:var(--card);border-radius:12px;width:100%;max-width:760px;padding:18px}
.md h2{margin:0 0 8px;font-size:17px}.md h3{margin:16px 0 6px;font-size:14px;color:var(--ac);border-bottom:1px solid var(--bd);padding-bottom:3px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.gr label{display:block;font-size:12.5px;color:var(--mu)}.gr input,.gr select{width:100%}
.ph{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.ph div{position:relative}.ph img{width:100px;height:100px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);cursor:zoom-in;display:block}
.ph button{position:absolute;top:3px;right:3px;border:0;background:rgba(0,0,0,.65);color:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer}
.ft{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:12px}
.note{background:var(--card);border:1px dashed var(--ac);padding:10px 12px;border-radius:8px;margin-bottom:10px;font-size:13.5px}
#big{max-width:94vw;max-height:90vh;border-radius:8px}
.ok{color:var(--ok)}.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px;margin-bottom:10px}.kpi div{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}.kpi b{display:block;font-size:21px;line-height:1.2}.kpi span{font-size:12px;color:var(--mu)}.kpi .al{cursor:pointer;border-color:var(--bad)}.kpi [data-al]{cursor:pointer}.e{}
.grp{margin-bottom:10px}.grp>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 14px;background:var(--card);border:1px solid var(--bd);border-radius:8px;font-weight:600;position:sticky;top:0;z-index:2}
.grp>summary::-webkit-details-marker{display:none}.grp>summary::before{content:"▸";margin-right:8px;color:var(--ac)}.grp[open]>summary::before{content:"▾"}.grp>summary span:first-child{flex:1}
.grp[open]>summary{border-radius:8px 8px 0 0}.grp .tw{border-top:0;border-radius:0 0 8px 8px}
tr.sh td{background:var(--bg);color:var(--ac);font-weight:600;font-size:13px;cursor:default}
.bar2{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:4px 0}.bar2 i{display:block;height:100%;background:var(--ac)}.bar2 i.full{background:var(--bad)}
.ckr{display:grid;grid-template-columns:62px 72px 78px 1fr 100px 34px;gap:6px;margin-bottom:6px}.ckr input,.ckr select{width:100%;min-width:0}
.ckr button{border:1px solid var(--bd);background:var(--card);color:var(--bad);border-radius:7px;cursor:pointer}
@media(max-width:720px){
header{padding:10px 14px}header h1{font-size:16px}main{padding:10px 10px 96px}nav{padding:8px 10px 0}
input,select,textarea{font-size:16px}.btn{padding:10px 14px}
.bar input[type=search]{flex:1 1 100%}.bar select{flex:1}
.grp thead{display:none}.grp table,.grp tbody{display:block}
.grp tbody tr{display:block;padding:8px 12px;border-bottom:1px solid var(--bd)}
.grp td{display:flex;justify-content:space-between;gap:12px;padding:2px 0;border:0;white-space:normal;text-align:right}
.grp td[data-l]::before{content:attr(data-l);color:var(--mu);text-align:left;flex:none}
.grp td.n,.grp td.e{display:none}.grp tr.sh{padding:6px 12px}.grp tr.sh td{display:block;text-align:left;padding:0}
.ov{padding:0}.md{max-width:none;border-radius:0;min-height:100%;padding:14px 14px 0}
.gr{grid-template-columns:1fr 1fr}.ft{position:sticky;bottom:0;background:var(--card);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd)}
#add{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));border-radius:99px;padding:14px 20px;box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:10}
.ckr{grid-template-columns:1fr 1fr 1fr 34px}.ckr input[data-k=load]{grid-column:1/4;grid-row:2}.ckr select{grid-column:1/4;grid-row:3}.ckr button{grid-row:1;grid-column:4}
}
.mr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 12px;border-bottom:1px solid var(--bd);background:var(--card)}.mr.fl{background:var(--bg)}.mr.rm{padding-left:28px}.mr.it{padding-left:42px}.sp{flex:1}
.ch{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);color:var(--mu)}.ib{border:1px solid var(--bd);background:var(--card);color:var(--ac);border-radius:6px;padding:3px 9px;cursor:pointer;font:inherit;font-size:13px}
.lk{color:var(--ac);cursor:pointer;font-size:13px;margin-right:10px;text-decoration:underline}a[data-a]{cursor:pointer}.mb{border:1px solid var(--bd);border-top:0;border-radius:0 0 8px 8px;overflow:hidden;margin-bottom:0}.grp>summary{flex-wrap:wrap}
header p.syn{margin:8px 0 0;opacity:.95;font-size:12.5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:#e0a100}.dot.on{background:#3ddc84}.dot.off{background:#ff7a6b}
#syn .lk{color:inherit;margin:0;opacity:.9}
[data-s][hidden]{display:none!important}#kt{display:inline-flex;gap:4px;flex-wrap:wrap}#kt[hidden]{display:none}tr.ina td{opacity:.5}
.auth{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}.auth .btn{padding:4px 12px;font-size:13px}.auth .rl{padding:2px 10px;border-radius:99px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35)}
.rg label{display:block;padding:9px 12px;border:1px solid var(--bd);border-radius:8px;margin:7px 0;cursor:pointer;font-size:14px}.rg label:has(input:checked){border-color:var(--ac);background:var(--bg)}.rg input{width:auto;margin-right:8px}.rg .mu{display:block;margin-left:24px}
.ni{width:19px;height:19px;vertical-align:-4px;margin-right:7px;fill:none;stroke:var(--ic,currentColor);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}nav button.on .ni{stroke:currentColor}
.lst table{min-width:1180px;border-collapse:collapse}.lst td,.lst th{padding:3px 4px;white-space:nowrap}.lst th{font-size:12px}.lst input,.lst select{width:100%;min-width:0;padding:4px 5px;font-size:13px}.gg{display:grid;grid-template-columns:44px minmax(90px,1fr) auto;align-items:center;gap:8px;margin:4px 0;font-size:13px}.gg.sm{grid-template-columns:14px 72px auto;gap:5px;margin:1px 0;font-size:11.5px}.gl{color:var(--mu);font-weight:600}.gb{position:relative;height:13px;background:var(--bd);border-radius:7px;overflow:hidden}.gg.sm .gb{height:7px}.gb i{display:block;height:100%;background:var(--ok);border-radius:7px}.gb i.w{background:#e0a100}.gb i.f{background:var(--bad)}.gb u{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed rgba(0,0,0,.5)}.gv{white-space:nowrap}
@media(prefers-color-scheme:dark){.gb u{border-left-color:rgba(255,255,255,.7)}}
.lst select{min-width:74px}.lst .w1{width:60px}.lst .w2{width:80px}.lst .w3{width:200px}.lst td.rs{font-size:12px;min-width:150px;white-space:normal}.lst button{border:1px solid var(--bd);background:var(--card);color:var(--bad);border-radius:7px;cursor:pointer;padding:3px 9px}
.wn{color:#b36b00;font-weight:600}@media(prefers-color-scheme:dark){.wn{color:#e0a100}}.kpi .pb{padding:0;border:0;border-radius:9px;background:var(--bd);height:8px;margin:5px 0 0}.md:has(.lst){max-width:1240px}.pb{margin:4px 0 2px;height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ac)}.pb i.w{background:#e0a100}.pb i.f{background:var(--bad)}

/* ===== หน้าหลัก (Dashboard) — ทุกกฎอยู่ใต้ #home เพื่อไม่ชนกับหน้าอื่น ===== */
#home{--lok:#1e8a4c;--lwn:#e0a100;--lbd:#c0392b;--twn:#b36b00;--bus:#12356b;max-width:1320px;margin:0 auto;font-variant-numeric:tabular-nums}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) #home{--lok:#4cc884;--lbd:#ff7a6b;--twn:#e0a100;--bus:#5b9bff}}
:root[data-theme="dark"] #home{--lok:#4cc884;--lbd:#ff7a6b;--twn:#e0a100;--bus:#5b9bff}
#home .hl{padding:60px 0;text-align:center;color:var(--mu)}
#home .em{margin:6px 0 2px;color:var(--mu);font-size:13.5px}
#home .t-bd{color:var(--lbd)}#home .t-wn{color:var(--twn)}

/* หลอดไฟสถานะ (pilot lamp): สีไม่ใช่ตัวบอกอย่างเดียว ทุกที่มีข้อความกำกับ */
#home .lamp{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bd);flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
#home .lamp.ok{background:var(--lok);box-shadow:0 0 0 3px color-mix(in srgb,var(--lok) 22%,transparent)}
#home .lamp.wn{background:var(--lwn);box-shadow:0 0 0 3px color-mix(in srgb,var(--lwn) 26%,transparent)}
#home .lamp.bd{background:var(--lbd);box-shadow:0 0 0 3px color-mix(in srgb,var(--lbd) 26%,transparent);animation:hp 2.2s ease-in-out infinite}
@keyframes hp{0%,100%{opacity:1}50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){#home .lamp.bd{animation:none}}

/* หัวหน้า: ประโยคสรุปสถานะ */
#home .hh{display:flex;gap:16px;align-items:center;margin:6px 2px 30px}
#home .hh .lamp{width:16px;height:16px}
#home .hh h2{margin:0;font-size:27px;line-height:1.35;font-weight:300}
#home .hh p{margin:3px 0 0;color:var(--mu);font-size:13.5px}

/* แผงอุปกรณ์: บัสบาร์ + ช่องต่อออกไปยังแต่ละระบบ */
#home .mods{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:34px 12px;padding-top:17px;margin-bottom:34px}
#home .mod{position:relative;display:flex;flex-direction:column;gap:3px;min-height:150px;text-align:left;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;cursor:pointer}
#home .mod:hover{border-color:var(--ac)}
#home .mod:focus-visible,#home .wi:focus-visible,#home .go:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#home .mod::before{content:"";position:absolute;left:50%;top:-17px;width:3px;height:17px;margin-left:-1.5px;background:var(--bus)}
#home .mod::after{content:"";position:absolute;top:-17px;left:-6px;right:-6px;height:3px;background:var(--bus)}
#home .mx{display:contents}
#home .ms{order:1;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mu);min-height:20px;flex-wrap:wrap}
#home .mn{order:2;display:flex;align-items:center;font-weight:600;font-size:14.5px;margin-top:6px}
#home .mn .ni{flex:none}
#home .mv{order:3;display:flex;align-items:baseline;gap:6px;margin:4px 0 6px}
#home .mv b{font-size:40px;line-height:1.05;font-weight:300}
#home .mv span{font-size:13px;color:var(--mu)}
#home .mm{order:4;font-size:12.5px;color:var(--mu);line-height:1.4}
@media(min-width:1060px){#home .mod:first-child::after{left:50%}#home .mod:last-child::after{right:50%}}
@media(min-width:721px) and (max-width:1059px){
 #home .mods{grid-template-columns:repeat(3,minmax(0,1fr))}
 #home .mod:nth-child(3n+1)::after{left:50%}#home .mod:nth-child(3n)::after{right:50%}
}

/* แผ่นเนื้อหา */
#home .hg{display:grid;gap:18px;margin-bottom:18px;align-items:start}
#home .hc{display:flex;flex-direction:column;gap:18px;min-width:0}
@media(min-width:1060px){#home .hg{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
#home .pn{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:18px 20px;min-width:0}
#home .pn h3{margin:0;font-size:16.5px;font-weight:600}
#home .pn .sb{margin:3px 0 14px;font-size:13px;color:var(--mu);line-height:1.5}

/* รายการที่ต้องดูแล */
#home .wg+.wg{border-top:1px solid var(--bd)}
#home .wg>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 2px}
#home .wg>summary::-webkit-details-marker{display:none}
#home .wg>summary::after{content:"";flex:none;width:7px;height:7px;margin:0 4px 3px 2px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(45deg);transition:transform .15s}
#home .wg[open]>summary::after{transform:rotate(-135deg);margin-bottom:-2px}
#home .wg>summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px}
#home .wt{flex:1;font-weight:600;min-width:0}
#home .wc{min-width:2em;text-align:right;color:var(--mu)}
#home .wg ul,#home .fd{list-style:none;margin:0;padding:0}
#home .wg ul{padding-left:20px;margin-bottom:4px}
#home .wi{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;border-radius:7px;padding:7px 8px;cursor:pointer}
#home .wi:hover{background:var(--bg)}
#home .l1{font-weight:600}
#home .l2{color:var(--mu);font-size:13px;margin-left:6px}
#home .l3{display:block;font-size:13px;margin-top:1px}
#home .wg .mu{margin:2px 0 0 28px;font-size:12.5px}
#home .go{border:0;background:none;color:var(--ac);font:inherit;font-size:13px;cursor:pointer;padding:6px 8px;margin:2px 0 10px 20px;text-decoration:underline;text-underline-offset:3px;border-radius:5px}

/* น้ำมันสำรอง */
#home .fu{position:relative;padding-top:22px;--lw:140px;--vw:70px}
#home .fr{display:grid;grid-template-columns:var(--lw) minmax(0,1fr) var(--vw);gap:10px;align-items:center;margin:10px 0}
#home .fn{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#home .ft2{height:12px;background:var(--bd);border-radius:6px;overflow:hidden}
#home .ft2 i{display:block;height:100%;border-radius:6px;background:var(--lok)}
#home .ft2 i.wn{background:var(--lwn)}#home .ft2 i.bd{background:var(--lbd)}
#home .fv{text-align:right;font-size:13.5px;white-space:nowrap}
#home .thr{position:absolute;top:0;bottom:0;left:calc(var(--lw) + 10px);right:calc(var(--vw) + 10px);pointer-events:none}
#home .thr u{position:absolute;top:18px;bottom:0;border-left:1.5px dashed var(--tx);opacity:.5;text-decoration:none}
#home .thr em{position:absolute;top:0;transform:translateX(-50%);font-style:normal;font-size:11.5px;color:var(--mu);white-space:nowrap}
#home .fu+.mu{margin:10px 0 0;font-size:12.5px}

/* กำหนดเปลี่ยนแบตเตอรี่ */
#home .bt{display:flex;align-items:flex-end;gap:8px;overflow-x:auto;padding:2px 2px 4px;min-height:150px}
#home .bc{flex:1 0 36px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font-size:12px}
#home .bc b{font-weight:600;font-size:13px;min-height:18px}
#home .bc i{display:block;width:100%;max-width:40px;border-radius:5px 5px 0 0;background:var(--ac)}
#home .bc.bd i{background:var(--lbd)}#home .bc.wn i{background:var(--lwn)}
#home .bc.z i{height:2px!important;background:var(--bd);border-radius:0}
#home .bc span{color:var(--mu)}
#home .bc em{font-style:normal;font-size:11.5px;color:var(--twn);min-height:15px;font-weight:600}
#home .bt+.mu{margin:8px 0 0;font-size:12.5px}

/* ความครบถ้วนของข้อมูล */
#home .cr{display:grid;grid-template-columns:170px minmax(0,1fr) 46px;gap:12px;align-items:center;padding:7px 0}
#home .cn{display:flex;align-items:flex-start;font-size:14px;line-height:1.35;min-width:0}
#home .cn .ni{flex:none;margin-top:2px}
#home .cn small{display:block;color:var(--mu);font-size:12px}
#home .cb{height:8px;background:var(--bd);border-radius:5px;overflow:hidden}
#home .cb i{display:block;height:100%;background:var(--ac);border-radius:5px}
#home .cb i.full{background:var(--lok)}
#home .cv{text-align:right;font-weight:600}
#home .dq{list-style:none;margin:14px 0 0;padding:12px 0 0;border-top:1px solid var(--bd)}
#home .dq li{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:13.5px}
#home .dq li>span:nth-child(2){flex:1;min-width:0}
#home .dq .go{margin:0}

/* แก้ไขล่าสุด */
#home .fi{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
#home .fi time{font-size:12.5px;white-space:nowrap}

@media(max-width:720px){
 #home .hh{margin-bottom:22px;gap:12px}#home .hh h2{font-size:21px}

/* ===== แผนที่สถานที่ — ทุกกฎอยู่ใต้ #mapv ===== */
#mapv{--lok:#1e8a4c;--lwn:#e0a100;--lbd:#c0392b;--twn:#b36b00;max-width:1320px;margin:0 auto;font-variant-numeric:tabular-nums}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) #mapv{--lok:#4cc884;--lbd:#ff7a6b;--twn:#e0a100}}
:root[data-theme="dark"] #mapv{--lok:#4cc884;--lbd:#ff7a6b;--twn:#e0a100}
#mapv .hl{padding:50px 0;text-align:center;color:var(--mu)}
#mapv .em{margin:6px 0 2px;color:var(--mu);font-size:13.5px}
#mapv .t-bd{color:var(--lbd)}#mapv .t-wn{color:var(--twn)}
#mapv .lamp{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bd);flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
#mapv .lamp.ok{background:var(--lok);box-shadow:0 0 0 3px color-mix(in srgb,var(--lok) 22%,transparent)}
#mapv .lamp.wn{background:var(--lwn);box-shadow:0 0 0 3px color-mix(in srgb,var(--lwn) 26%,transparent)}
#mapv .lamp.bd{background:var(--lbd);box-shadow:0 0 0 3px color-mix(in srgb,var(--lbd) 26%,transparent)}

#mapv .mh{margin:6px 2px 18px}
#mapv .mh h2{margin:0;font-size:27px;line-height:1.35;font-weight:300}
#mapv .mh p{margin:3px 0 0;color:var(--mu);font-size:13.5px}

/* ภาพแผนที่ + จุดกด (ตำแหน่งเป็นเปอร์เซ็นต์ของภาพ จึงตรงกับป้ายในภาพทุกขนาดจอ) */
#mapv .mapw{border:1px solid var(--bd);border-radius:10px;overflow-x:auto;background:#0b1a33;overscroll-behavior-x:contain}
#mapv .mapf{position:relative;min-width:920px;line-height:0}
#mapv .mapf img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
#mapv .pin{position:absolute;padding:0;border:0;border-radius:12px;background:transparent;cursor:pointer}
#mapv .pin:hover{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ac)}
#mapv .pin:focus-visible{outline:3px solid #fff;outline-offset:2px;box-shadow:0 0 0 6px var(--ac)}
#mapv .pin.on{box-shadow:0 0 0 3px #fff,0 0 0 6px #ffd400}
#mapv .bdg{position:absolute;margin:0;top:-11px;right:-11px;min-width:23px;height:23px;padding:0 5px;border-radius:12px;display:grid;place-items:center;font:700 12.5px/1 Sarabun,"Noto Sans Thai",system-ui,sans-serif;color:#fff;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.45);pointer-events:none}
#mapv .bdg.bd{background:#c0392b}#mapv .bdg.wn{background:#e0a100;color:#1b1400}#mapv .bdg.ok{background:#1e8a4c}#mapv .bdg.off{display:none}
#mapv .tg{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;border:3px solid #ffd400;box-shadow:0 0 0 2px #fff;opacity:0;transition:opacity .15s;pointer-events:none}
#mapv .tg.on{opacity:1}
@media(prefers-reduced-motion:reduce){#mapv .tg{transition:none}}
#mapv .mlg{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;margin:10px 2px 18px;font-size:12.5px;color:var(--mu)}
#mapv .mlg span{display:inline-flex;align-items:center;gap:7px}
#mapv .mlg .bdg{position:static;pointer-events:auto;min-width:21px;height:21px;font-size:11.5px}

/* หมายเลขสถานที่ (สีเดียวกับป้ายเหลืองในภาพ) */
#mapv .nb{display:inline-grid;place-items:center;flex:none;width:24px;height:24px;margin-right:9px;border-radius:50%;background:#ffd400;color:#0b2a55;font-weight:700;font-size:13px;vertical-align:middle}
#mapv .nb.x{background:transparent;box-shadow:inset 0 0 0 1.5px var(--bd)}

/* แผ่นรายละเอียดสถานที่ */
#mapv .pn{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:18px 20px;margin-bottom:18px;min-width:0}
#mapv .mph{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#mapv .mph h3{margin:0;font-size:19px;font-weight:600;flex:0 1 auto}
#mapv .mps{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;flex:1}
#mapv .pn .sb{margin:4px 0 14px;font-size:13px;color:var(--mu)}
#mapv .mpg{display:grid;gap:22px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
#mapv .mpc{min-width:0}
#mapv h4{margin:0 0 8px;font-size:14px;font-weight:600}
#mapv .mpc h4+ul+h4,#mapv .mpc p+h4,#mapv .mpc ul+h4{margin-top:20px}
#mapv .mpl{list-style:none;margin:0;padding:0}
#mapv .mrow,#mapv .mr0{display:grid;grid-template-columns:minmax(0,1.3fr) auto minmax(0,1.2fr) auto;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 10px;border-radius:8px;font:inherit;color:inherit}
#mapv .mrow{border:1px solid var(--bd);background:var(--card);margin-bottom:6px;cursor:pointer}
#mapv .mrow:hover{border-color:var(--ac)}
#mapv .mr0{color:var(--mu);padding:7px 10px;margin-bottom:2px;display:flex;justify-content:space-between}
#mapv .mrn{display:flex;align-items:center;font-weight:600;min-width:0}
#mapv .mr0 .mrn{font-weight:400}
#mapv .mrc{white-space:nowrap}
#mapv .mrs{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
#mapv .mro{color:var(--ac);font-size:13px;text-decoration:underline;text-underline-offset:3px}
#mapv .wi{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;border-radius:7px;padding:7px 8px;cursor:pointer}
#mapv .wi:hover{background:var(--bg)}
#mapv .l1{font-weight:600}
#mapv .l2{color:var(--mu);font-size:13px;margin-left:6px}
#mapv .l3{display:block;font-size:13px;margin-top:1px}
#mapv .mrow:focus-visible,#mapv .wi:focus-visible,#mapv .go:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#mapv .go{border:0;background:none;color:var(--ac);font:inherit;font-size:13px;cursor:pointer;padding:4px 8px;text-decoration:underline;text-underline-offset:3px;border-radius:5px}
#mapv .mph .go{margin-left:auto}
#mapv .mrm{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 8px;border-bottom:1px solid var(--bd)}
#mapv .mrm:last-child{border-bottom:0}
#mapv .mrl{font-size:13.5px;min-width:0}
#mapv .mrh{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
#mapv .mpc .mu{margin:6px 8px 0;font-size:12.5px}

/* ตารางสรุปตามสถานที่ */
#mapv .mt td,#mapv .mt th{padding:8px 12px}
#mapv .mt th.c,#mapv .mt td.c{text-align:center}
#mapv .mt td.st{white-space:nowrap}
#mapv .mt td.st .lamp{margin-right:8px;vertical-align:1px}
#mapv .mt tr.sel td{background:color-mix(in srgb,var(--ac) 11%,var(--card))}
#mapv .mt tr.tot td{font-weight:600;cursor:default;background:var(--bg)}
#mapv .mt tr.tot:hover td{background:var(--bg)}
#mapv .mnb{display:inline-flex;align-items:center;border:0;background:none;color:var(--tx);font:inherit;font-weight:600;padding:0;cursor:pointer;text-align:left}
#mapv .mnb:focus-visible{outline:2px solid var(--ac);outline-offset:3px;border-radius:4px}
#mapv .mn2{margin:10px 2px 0;font-size:12.5px;color:var(--mu);line-height:1.6}

@media(max-width:1059px){#mapv .mpg{grid-template-columns:1fr}}
@media(max-width:720px){
 #mapv .mh h2{font-size:21px}
 #mapv .pn{padding:15px 14px}
 #mapv .mrow,#mapv .mr0{grid-template-columns:minmax(0,1fr) auto;row-gap:2px}
 #mapv .mrow .mrs{grid-column:1}#mapv .mrow .mro{grid-column:2;grid-row:2;justify-self:end}
 #mapv .mph h3{font-size:17px}
}
</style>

const LSP_DEF={vln:240,warn:80,imbW:10,imbB:20};let LSP={...LSP_DEF};
const va=v=>{const n=parseFloat(String(v??'').replace(/,/g,''));return isFinite(n)?n:0};
const ckts=s=>String(s??'').split(/[^0-9]+/).filter(Boolean).map(Number);
const phOf=n=>(Math.ceil(n/2)-1)%3;            // ช่อง 1,2=A · 3,4=B · 5,6=C · 7,8=A ...
const PHN=['A','B','C'];
function lcalc(r){const P=LSP,ck=r._ck||[],ph=+r.f7===1?1:3,main=va(r.f8),bus=va(r.f15),o={A:0,B:0,C:0,rows:[],msgs:[],ph,main};
 const seen={},chk=[];
 ck.forEach(c=>{const v=[va(c.a),va(c.b),va(c.c)],at=va(c.amp),pk=Math.max(...v),I=pk/P.vln,x={I,at,tot:v[0]+v[1]+v[2],st:'',pct:at?I/at*100:null};
  o.A+=v[0];o.B+=v[1];o.C+=v[2];
  if(x.tot>0&&at){x.st=I>at?'เกิน':I>at*P.warn/100?'ใกล้เต็ม':'ปกติ'}
  const lb='CKT '+(c.no||'?')+(c.load?' ('+c.load+')':'');
  if(x.st==='เกิน')o.msgs.push(['bd',lb+': โหลด '+f1(I)+' A เกิน CB '+at+' A (' +f0(x.pct)+'%)']);else if(x.st==='ใกล้เต็ม')o.msgs.push(['wn',lb+': โหลด '+f1(I)+' A = '+f0(x.pct)+'% ของ CB '+at+' A']);
  const n=ckts(c.no);if(ph===3&&(c.pole||'1P')==='1P'&&n.length===1&&v.filter(z=>z>0).length===1){const g=v.findIndex(z=>z>0),e=phOf(n[0]);chk.push({x,ok:g===e,m:['wn',lb+': หมายเลขช่องนี้ปกติอยู่เฟส '+PHN[e]+' แต่กรอกโหลดไว้ที่เฟส '+PHN[g]+' — ตรวจว่ากรอกคอลัมน์ถูกต้อง']})}
  n.forEach(k=>{seen[k]=(seen[k]||0)+1});o.rows.push(x)});
 // ตรวจเลขช่อง↔เฟส เฉพาะตู้ที่ส่วนใหญ่ใช้การเรียงเลขแบบมาตรฐาน (1,3,5=A,B,C · 2,4,6=A,B,C) — ตู้ที่เรียงเลขแบบอื่นข้ามการตรวจนี้
 if(chk.length&&chk.filter(z=>z.ok).length>=chk.length*0.7)chk.filter(z=>!z.ok).forEach(z=>{z.x.mm=1;o.msgs.push(z.m)});
 Object.keys(seen).filter(k=>seen[k]>1).forEach(k=>o.msgs.push(['wn','หมายเลขช่อง '+k+' ซ้ำ '+seen[k]+' แถว']));
 o.tot=o.A+o.B+o.C;o.has=o.tot>0;
 if(ph===1){o.I={A:o.tot/P.vln};o.Imax=o.I.A}else{o.I={A:o.A/P.vln,B:o.B/P.vln,C:o.C/P.vln};o.Imax=Math.max(o.I.A,o.I.B,o.I.C)}
 o.pct=o.has&&main?o.Imax/main*100:null;
 o.status=o.pct==null?null:o.pct>100?'เกิน':o.pct>P.warn?'ใกล้เต็ม':'ปกติ';
 if(o.status==='เกิน')o.msgs.unshift(['bd','โหลดรวมเกิน CB Main: กระแสสูงสุด '+f1(o.Imax)+' A เทียบ '+main+' A ('+f0(o.pct)+'%)']);else if(o.status==='ใกล้เต็ม')o.msgs.unshift(['wn','โหลดใกล้เต็ม CB Main: '+f0(o.pct)+'% (เกณฑ์เตือน '+P.warn+'%)']);
 if(bus&&o.has&&o.Imax>bus)o.msgs.unshift(['bd','กระแสสูงสุด '+f1(o.Imax)+' A เกินพิกัด Busbar '+bus+' A']);
 if(ph===3&&o.tot>0){const v=[o.A,o.B,o.C],avg=o.tot/3,mx=Math.max(...v),mn=Math.min(...v);o.imb=Math.max(mx-avg,avg-mn)/avg*100;o.imbS=o.imb<=P.imbW?'สมดุล':o.imb<=P.imbB?'ควรปรับ':'ไม่สมดุล';o.hi=v.indexOf(mx);o.lo=v.indexOf(mn);o.mv=Math.round((mx-mn)/2/10)*10;
  if(o.imbS!=='สมดุล')o.msgs.push([o.imbS==='ควรปรับ'?'wn':'bd','เฟสไม่สมดุล '+f1(o.imb)+'% (เกณฑ์ ≤'+P.imbW+'%) — แนะนำย้ายโหลดประมาณ '+f0(o.mv)+' VA จากเฟส '+PHN[o.hi]+' ไปเฟส '+PHN[o.lo]])}

 const bar=(p)=>`<div class="pb"><i class="${p>100?'f':p>P.warn?'w':''}" style="width:${Math.min(100,p||0)}%"></i></div>`;
 let h=`<h3 style="margin-top:14px">ผลตรวจโหลดอัตโนมัติ</h3><div class="note"><span class="mu">เกณฑ์: แรงดันเฟส ${P.vln} V · เตือนเมื่อโหลด ≥ ${P.warn}% ของ CB · เฟสสมดุลเมื่อเบี่ยงเบนจากค่าเฉลี่ย ≤ ${P.imbW}% (แก้ได้ที่ปุ่ม “เกณฑ์ตรวจโหลด”)</span>`;
 if(!o.has)h+='<div style="margin-top:6px">ยังไม่มีข้อมูลโหลด — กรอกโหลด (VA) ของแต่ละวงจรในตารางด้านบน</div>';
 else{const ph=o.ph===1?['A']:PHN;
  h+=`<div style="margin-top:8px"><div class="mu" style="font-size:12px">กระแสที่ใช้ / Capacity (CB Main ${o.main?o.main+' A':'— ยังไม่ได้กรอก'}) · เส้นประ = จุดเตือน ${P.warn}%</div>`+ph.map(p=>gauge(o.ph===1?'รวม':'เฟส '+p,o.I[p],o.main,0,1)).join('')+`</div><div class="kpi" style="margin:8px 0 0">`+ph.map(p=>{const va_=o[p],I=o.I[p],pc_=o.main?I/o.main*100:null;return`<div><b>${f0(o.ph===1?o.tot:va_)} VA</b><span>${o.ph===1?'โหลดรวม (1 เฟส)':'เฟส '+p} · ${f1(I)} A${pc_!=null?' · '+f0(pc_)+'%':''}</span></div>`}).join('')+
  `<div class="${o.status==='เกิน'?'al':''}"><b class="${o.status?lcCls(o.status):''}">${o.status||'-'}</b><span>เทียบ CB Main ${o.main?o.main+' A':'(ยังไม่ได้กรอก)'}${o.pct!=null?' · '+f0(o.pct)+'%':''}</span></div>`+

  if(!o.main)h+='<div class="wn" style="margin-top:6px">ยังไม่ได้กรอก CB Main (A) จึงเทียบโหลดเกินไม่ได้</div>';
  h+=o.msgs.length?'<ul style="margin:8px 0 0 18px;padding:0">'+o.msgs.map(m=>`<li class="${m[0]}">${esc(m[1])}</li>`).join('')+'</ul>':(o.main?'<div class="ok" style="margin-top:6px">✓ ไม่พบโหลดเกินและเฟสสมดุลตามเกณฑ์</div>':'')}

function lsimRes(){const r=$('#lsr'),i=$('#lsv');if(!r||!i)return;const x=va(i.value);if(!(x>0)){r.innerHTML='';return}
 const o=lcalc(curRow()),P=LSP,main=o.main;let t='';
 if(o.ph===1){const I=(o.tot+x)/P.vln,p=main?I/main*100:null;t=`รวมหลังต่อ ${f0(o.tot+x)} VA = ${f1(I)} A`+(p!=null?` · <b class="${lcCls(p>100?'เกิน':p>P.warn?'ใกล้เต็ม':'ปกติ')}">${f0(p)}% ของ CB Main</b>`:'')}
 else{const v=[o.A,o.B,o.C],k=v.indexOf(Math.min(...v)),n=v.slice();n[k]+=x;const tot=n[0]+n[1]+n[2],avg=tot/3,imb=Math.max(Math.max(...n)-avg,avg-Math.min(...n))/avg*100,s=imb<=P.imbW?'สมดุล':imb<=P.imbB?'ควรปรับ':'ไม่สมดุล',I=Math.max(...n)/P.vln,p=main?I/main*100:null,ps=p==null?null:p>100?'เกิน':p>P.warn?'ใกล้เต็ม':'ปกติ';

  if(main){const room=Math.max(0,main*P.warn/100*P.vln-v[k]);t+=` · เฟส ${PHN[k]} เพิ่มได้อีกสูงสุดประมาณ ${f0(room)} VA (ไม่เกิน ${P.warn}% ของ CB Main)`}}

/* ===== สิทธิ์การใช้งาน: ผู้เยี่ยมชม (ดูอย่างเดียว) / ผู้แก้ไข (Edit) / ผู้ดูแลระบบ (Admin) ===== */
const sha=m=>{const u=new TextEncoder().encode(m),l=u.length,n=((l+9+63)>>6)<<6,w=new Uint8Array(n);w.set(u);w[l]=128;const dv=new DataView(w.buffer);dv.setUint32(n-4,(l*8)>>>0);dv.setUint32(n-8,Math.floor(l*8/4294967296));
 const K=[],H0=[],pr=[];for(let i=2;pr.length<64;i++)if(pr.every(p=>i%p))pr.push(i);pr.forEach((p,i)=>{K[i]=Math.floor((Math.cbrt(p)%1)*4294967296);if(i<8)H0[i]=Math.floor((Math.sqrt(p)%1)*4294967296)});
 const rr=(x,k)=>(x>>>k)|(x<<(32-k));let H=H0.slice();
 for(let o=0;o<n;o+=64){const Wd=new Array(64);for(let i=0;i<16;i++)Wd[i]=dv.getUint32(o+i*4);
  for(let i=16;i<64;i++){const a=Wd[i-15],c=Wd[i-2];Wd[i]=(Wd[i-16]+(rr(a,7)^rr(a,18)^(a>>>3))+Wd[i-7]+(rr(c,17)^rr(c,19)^(c>>>10)))>>>0}
  let [a,b,c,d,e,f,g,h]=H;
  for(let i=0;i<64;i++){const t1=(h+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[i]+Wd[i])>>>0,t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&b)^(a&c)^(b&c)))>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0}
  H=H.map((v,i)=>(v+[a,b,c,d,e,f,g,h][i])>>>0)}
 return H.map(v=>v.toString(16).padStart(8,'0')).join('')};

 if(s<60)return'เมื่อสักครู่';if(s<3600)return Math.floor(s/60)+' นาทีที่แล้ว';if(s<86400)return Math.floor(s/3600)+' ชั่วโมงที่แล้ว';if(s<604800)return Math.floor(s/86400)+' วันที่แล้ว';

   al.forEach(t=>{const[ti,sv,od]=hClass(c.id,t);if(sv==='bd')worst='bd';
    const k=c.id+'|'+ti;let g=G.get(k);if(!g)G.set(k,g={key:k,c,ti,sv,od,items:[]});
    let it=g.items.find(x=>x.r===r);if(!it)g.items.push(it={r,t:[]});it.t.push(t)});
   const k2=worst==='bd'?'bad':'wn';o[k2]++;H[k2]++;if(sb)sb[k2]++});
  o.cp=o.n?Math.round(o.cp/o.n):0});
 H.groups=[...G.values()].sort((a,b)=>(a.sv==='bd'?0:1)-(b.sv==='bd'?0:1)||a.od-b.od||b.items.length-a.items.length);
 const P=fx();
 H.fuel=DATA.generator.map(r=>({r,c:gcalc(r,P)})).filter(x=>typeof x.c.hrs==='number').sort((a,b)=>a.c.hrs-b.c.hrs);
 return H}

/* --- 1) ประโยคสรุปสถานะ --- */
function hHead(H){
 const d=new Date().toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 let tx,st;
 if(!H.total){tx='ยังไม่มีข้อมูลในระบบ';st='off'}
 else if(H.bad&&H.wn){tx=`มี ${f0(H.bad)} รายการเร่งด่วน และอีก ${f0(H.wn)} รายการที่ควรเฝ้าระวัง`;st='bd'}
 else if(H.bad){tx=`มี ${f0(H.bad)} รายการเร่งด่วน`;st='bd'}
 else if(H.wn){tx=`ไม่มีรายการเร่งด่วน มี ${f0(H.wn)} รายการที่ควรเฝ้าระวัง`;st='wn'}
 else{tx='ทุกรายการอยู่ในเกณฑ์ปกติ';st='ok'}
 return `<div class="hh"><i class="lamp ${st}" aria-hidden="true"></i><div><h2>${tx}</h2><p>${d} ตรวจจากอุปกรณ์ทั้งหมด ${f0(H.total)} รายการ</p></div></div>`}

/* --- 2) แผงอุปกรณ์ (บัสบาร์ + ช่องต่อออกแต่ละระบบ) --- */

  ck=C.loadcenter.rows.filter(r=>(r._ck||[]).length).length,

  {id:'generator',ic:'generator',name:'Generator + ATS',unit:'เครื่อง',n:C.generator.n,has:C.generator.n,bad:C.generator.bad,wn:C.generator.wn,
   m:[`รวม ${f0(sum('generator','f7'))} kVA`,fr.length?`จ่ายไฟต่ำสุด ${f0(fr[0].c.hrs)} ชั่วโมง`:(C.generator.n?'ยังไม่มีข้อมูลน้ำมันคงเหลือ':'')]},
  {id:'loadcenter',ic:'loadcenter',name:'Load Center',unit:'ตู้',n:C.loadcenter.n,has:C.loadcenter.n,bad:C.loadcenter.bad,wn:C.loadcenter.wn,
   m:[`ช่องรวม ${f0(sum('loadcenter','f9'))} ช่อง`,C.loadcenter.n?`ระบุวงจรแล้ว ${f0(ck)} ตู้`:'']},
  {id:'ups',ic:'ups',tab:'UPS',name:'UPS',unit:'เครื่อง',n:U.length,has:U.length,bad:H.sub.UPS.bad,wn:H.sub.UPS.wn,
   m:[`รวม ${f0(U.reduce((a,r)=>a+(+r.kva||0),0))} kVA`,U.length?`แบตฯ ถึงกำหนดหรือเกิน ${f0(due)} เครื่อง`:'']},
  {id:'ups',ic:'sts',tab:'STS',name:'STS',unit:'ชุด',n:S.length,has:S.length,bad:H.sub.STS.bad,wn:H.sub.STS.wn,
   m:[S.length?(nosrc?`ยังไม่ระบุ UPS ต้นทาง ${f0(nosrc)} ชุด`:'ระบุ UPS ต้นทางครบทุกชุด'):'']},
  {id:'lighting',ic:'lighting',name:'แสงสว่าง',unit:'หลอด',n:sum('lighting','qty'),has:C.lighting.n,bad:C.lighting.bad,wn:C.lighting.wn,
   m:[C.lighting.n?`ชำรุดหรือดับ ${f0(sum('lighting','bad'))} หลอด`:'',C.lighting.n?`${f0(C.lighting.n)} รายการในระบบ`:'']},
  {id:'emergency',ic:'emergency',name:'ไฟฉุกเฉิน',unit:'ดวง',n:C.emergency.n,has:C.emergency.n,bad:C.emergency.bad,wn:C.emergency.wn,
   m:[C.emergency.n?`แบตเตอรี่ ${f0(sum('emergency','f8'))} ก้อน`:'',C.emergency.n?`ชำรุดหรือรอเปลี่ยน ${f0(emBad)} ดวง`:'']}];
 return `<div class="mods">`+M.map(m=>{

   tp=!m.has?'ยังไม่มีข้อมูล':parts.length?parts.map(p=>p[0]).join(' '):'ปกติ',
   tx=!m.has||!parts.length?tp:parts.map(p=>`<span class="${p[1]}">${p[0]}</span>`).join(' ');
  return `<button class="mod" data-hc="${m.id}"${m.tab?` data-tab="${m.tab}"`:''} aria-label="${esc(m.name+' '+f0(m.n)+' '+m.unit+' '+tp)}">`+
   `<span class="mx"><span class="ms"><i class="lamp ${st}" aria-hidden="true"></i>${tx}</span><span class="mn">${ico(m.ic)}${esc(m.name)}</span>`+
   m.m.filter(Boolean).map(t=>`<span class="mm">${esc(t)}</span>`).join('')+`</span>`+

/* --- 3) รายการที่ต้องดูแล (จัดกลุ่มตามสาเหตุ) --- */

   L.map(it=>{const[a,b]=hLbl(g.c,it.r);return `<li><button class="wi" data-hc="${g.c.id}" data-hid="${esc(it.r._id)}"><span class="l1">${esc(a)}</span><span class="l2">${esc(b)}</span><span class="l3 t-${g.sv}">${esc(it.t.slice(0,2).join(' / '))}</span></button></li>`}).join('')+

/* --- 4) น้ำมันสำรอง: แถบชั่วโมงจ่ายไฟ + เส้นเกณฑ์ --- */
function hFuel(H){
 const P=fx(),fr=H.fuel,G=H.cats.generator,AX=(P.h72||72)*2,pos=v=>Math.min(100,Math.max(0,v/AX*100));
 let sb='ระยะเวลาจ่ายไฟต่อเนื่องจากน้ำมันคงเหลือ',body;
 if(!fr.length)body=`<p class="em">${G.n?'ยังคำนวณไม่ได้ กรอกขนาด (kVA) เปอร์เซ็นต์โหลด และน้ำมันคงเหลือของเครื่องในหมวด Generator + ATS':'ยังไม่มีข้อมูลเครื่องกำเนิดไฟฟ้า'}</p>`;
 else{
  const nm=r=>[r.f2,r.f4].map(nz).filter(Boolean).join(' ')||'(ไม่มีชื่อ)',low=fr.filter(x=>x.c.hrs<P.h72),add=fr.reduce((a,x)=>a+(x.c.add||0),0),mn=fr[0];
  sb=low.length?`${f0(low.length)} เครื่องยังไม่ถึงเกณฑ์ ${P.h72} ชั่วโมง ต้องเติมน้ำมันรวม ${f0(add)} ลิตร`:`ทุกเครื่องถึงเกณฑ์ ${P.h72} ชั่วโมง เครื่องที่น้อยที่สุดคือ ${nm(mn.r)} จ่ายไฟได้ ${f0(mn.c.hrs)} ชั่วโมง`;
  body=`<div class="fu"><div class="thr"><u style="left:${pos(P.h24)}%"></u><em style="left:${pos(P.h24)}%">${P.h24}</em><u style="left:${pos(P.h72)}%"></u><em style="left:${pos(P.h72)}%">${P.h72} ชม.</em></div>`+
   fr.map(x=>{const h=x.c.hrs,k=h<P.h24?'bd':h<P.h72?'wn':'ok';
    return `<div class="fr"><span class="fn" title="${esc(nm(x.r))}">${esc(nm(x.r))}</span><div class="ft2"><i class="${k}" style="width:${pos(h)}%"></i></div><span class="fv" title="${f1(h/24)} วัน">${f0(h)} ชม.</span></div>`}).join('')+`</div>`;
  const skip=G.n-fr.length;if(skip>0)body+=`<p class="mu">ไม่นับอีก ${f0(skip)} เครื่องที่ยังไม่มีขนาด เปอร์เซ็นต์โหลด หรือน้ำมันคงเหลือ</p>`}
 return `<section class="pn"><h3>น้ำมันสำรองของเครื่องกำเนิดไฟฟ้า</h3><p class="sb">${esc(sb)}</p>${body}</section>`}

/* --- 5) กำหนดเปลี่ยนแบตเตอรี่ UPS แยกตามปี (พ.ศ.) --- */
function hBat(){
 const y=BE(),m={};let na=0,n=0;
 DATA.ups.forEach(r=>{if(kindOf(r)!=='UPS')return;n++;const b=+r.bnext;if(b>2400)m[b]=(m[b]||0)+1;else na++});
 const hd='<h3>กำหนดเปลี่ยนแบตเตอรี่ UPS</h3>',ys=Object.keys(m).map(Number);
 if(!n)return `<section class="pn">${hd}<p class="sb">จำนวน UPS แยกตามปีที่ต้องเปลี่ยน (พ.ศ.)</p><p class="em">ยังไม่มีข้อมูล UPS</p></section>`;
 if(!ys.length)return `<section class="pn">${hd}<p class="sb">จำนวน UPS แยกตามปีที่ต้องเปลี่ยน (พ.ศ.)</p><p class="em">ยังไม่มี UPS ที่ระบุปีที่ต้องเปลี่ยนแบตเตอรี่ (${f0(na)} เครื่อง)</p></section>`;
 const a=Math.min(y,...ys),z=Math.max(y,...ys),mx=Math.max(1,...Object.values(m)),over=ys.filter(v=>v<y).reduce((s,v)=>s+m[v],0),now=m[y]||0;
 const sb=[over?`เกินกำหนดแล้ว ${f0(over)} เครื่อง`:'',now?`ครบกำหนดปีนี้ ${f0(now)} เครื่อง`:''].filter(Boolean).join(' ')||'ไม่มีเครื่องที่เกินกำหนดหรือครบกำหนดปีนี้';
 let cols='';for(let i=a;i<=z;i++){const c=m[i]||0,k=c?(i<y?'bd':i===y?'wn':''):'z';
  cols+=`<div class="bc ${k}" title="พ.ศ. ${i} จำนวน ${c} เครื่อง"><b>${c||''}</b><i style="height:${c?Math.max(4,Math.round(c/mx*96)):0}px"></i><span>${i}</span><em>${i===y?'ปีนี้':''}</em></div>`}
 return `<section class="pn">${hd}<p class="sb">${esc(sb)}</p><div class="bt" role="img" aria-label="จำนวน UPS แยกตามปีที่ต้องเปลี่ยนแบตเตอรี่">${cols}</div>${na?`<p class="mu">ยังไม่ระบุปีที่ต้องเปลี่ยน ${f0(na)} เครื่อง</p>`:''}</section>`}

/* --- 6) ความครบถ้วนของข้อมูล + รายการตรวจคุณภาพข้อมูล --- */
function hComp(H){
 const rows=CATS.map(c=>{const o=H.cats[c.id];
  return `<div class="cr"><span class="cn">${ico(c.id)}<span>${esc(c.name)}<small>${o.n?`ครบ 100% แล้ว ${f0(o.full)} จาก ${f0(o.n)} รายการ`:'ยังไม่มีข้อมูล'}</small></span></span>`+
   (o.n?`<div class="cb" role="img" aria-label="ครบถ้วน ${o.cp}%"><i class="${o.cp>=100?'full':''}" style="width:${o.cp}%"></i></div><span class="cv">${o.cp}%</span>`:`<div class="cb"></div><span class="cv mu">-</span>`)+`</div>`}).join('');
 const all=H.total?Math.round(CATS.reduce((a,c)=>a+H.cats[c.id].cp*H.cats[c.id].n,0)/H.total):0;
 const nop=CATS.reduce((a,c)=>a+H.cats[c.id].nop,0),S=DATA.ups.filter(r=>kindOf(r)==='STS'),nosrc=S.filter(r=>!r.src1&&!r.src2&&r.st!=='ไม่ได้ใช้งาน').length,un=DATA.places.length?unmatched():null;
 const q=[];
 if(un==null)q.push(['wn','ยังไม่ได้สร้างข้อมูลหลักของสถานที่','master','เปิดข้อมูลหลัก']);
 else q.push([un?'wn':'ok',un?`${f0(un)} รายการมีชื่อสถานที่หรือ Line ที่ไม่ตรงกับข้อมูลหลัก`:'ชื่อสถานที่และ Line ตรงกับข้อมูลหลักทั้งหมด',un?'master':'',un?'ตรวจสอบ':'']);
 if(S.length)q.push([nosrc?'wn':'ok',nosrc?`${f0(nosrc)} ชุด STS ยังไม่ระบุ UPS ต้นทาง`:'STS ทุกชุดระบุ UPS ต้นทางแล้ว',nosrc?'ups':'',nosrc?'ดู STS':'','STS']);
 q.push([nop?'wn':'ok',nop?`${f0(nop)} จาก ${f0(H.total)} รายการยังไม่มีรูปถ่ายหรือลิงก์รูป`:'ทุกรายการมีรูปถ่ายหรือลิงก์รูปแล้ว','','']);
 return `<section class="pn"><h3>ความครบถ้วนของข้อมูล</h3><p class="sb">${H.total?`เฉลี่ยทุกหมวด ${all}% นับจากช่องจำเป็นและรูปถ่ายอย่างน้อย 1 รูป`:'เริ่มบันทึกอุปกรณ์จากแต่ละหมวดด้านบน'}</p>${rows}`+
  (H.total?`<ul class="dq">`+q.map(([k,t,go,gt,tab])=>`<li><i class="lamp ${k}" aria-hidden="true"></i><span>${esc(t)}</span>${go?`<button class="go" data-hc="${go}"${tab?` data-tab="${tab}"`:''}>${gt}</button>`:''}</li>`).join('')+`</ul>`:'')+`</section>`}

/* --- 7) แก้ไขล่าสุด (ไม่นับรายการที่นำเข้าข้อมูลตั้งต้นทีเดียวทั้งชุด) --- */
function hFeed(){

  (a.length?`<ul class="fd">`+a.slice(0,8).map(({c,r})=>`<li><button class="wi fi" data-hc="${c.id}" data-hid="${esc(r._id)}"><span><span class="l1">${esc(hLbl(c,r)[0])}</span><span class="l2">${esc(c.name)}${r._by?' โดย '+esc(r._by):''}</span></span><time class="mu">${ago(r._upd)}</time></button></li>`).join('')+`</ul>`:'<p class="em">ยังไม่มีการแก้ไข</p>')+`</section>`}

function homeHtml(){const H=homeData();
 return hHead(H)+hMods(H)+`<div class="hg"><div class="hc">${hWork(H)}</div><div class="hc">${hFuel(H)}${hBat()}</div></div><div class="hg">${hComp(H)}${hFeed()}</div>`}

/* ===== แผนที่สถานที่ =====
   ภาพถ่ายทางอากาศ + จุดกดทับป้ายของแต่ละสถานที่ → แสดงอุปกรณ์ของสถานที่นั้น และเปิดหมวดที่กรองเฉพาะสถานที่ได้
   จับคู่ชื่อสถานที่ในข้อมูลกับจุดบนแผนที่ด้วยรูปแบบชื่อ (ข้อมูลเดิมใช้ LLZ/GS ส่วนแผนที่ใช้ LOC/GP จึงถือเป็นที่เดียวกัน)

const MAPV={id:'map',name:'แผนที่'};
let SITEF=null,MSEL=null,MD=null;const mapSig={p:'',t:''};
const MW=2098,MH=749;   // ขนาดภาพต้นฉบับ (พิกเซล) ที่ใช้คำนวณตำแหน่งเป็นเปอร์เซ็นต์
// box = กรอบป้ายในภาพ [x0,y0,x1,y1] · dot = จุดปลายเส้นชี้ตำแหน่งจริง [x,y]
const MSITES=[
 {no:1,name:'หอฯ ทิศเหนือ',re:/หอ.*เหนือ/,box:[1440,171,1651,213],dot:[1413,228]},
 {no:2,name:'หอฯ ทิศใต้',re:/หอ.*ใต้/,box:[859,175,1048,215],dot:[842,233]},
 {no:3,name:'DVOR',re:/dvor/i,box:[47,535,191,573],dot:[60,599]},
 {no:4,name:'LOC-21R',re:/(loc|llz)-?21r/i,box:[73,391,249,430],dot:[65,460]},
 {no:5,name:'GP-03L',re:/(gp|gs)-?03l/i,box:[339,488,502,525],dot:[333,552]},
 {no:6,name:'LOC-21L',re:/(loc|llz)-?21l/i,box:[351,596,518,634],dot:[333,654]},
 {no:7,name:'GP-21R',re:/(gp|gs)-?21r/i,box:[1655,479,1820,519],dot:[1641,545]},
 {no:8,name:'GP-21L',re:/(gp|gs)-?21l/i,box:[1652,573,1820,612],dot:[1634,631]},
 {no:9,name:'LOC-03L',re:/(loc|llz)-?03l/i,box:[1843,331,2016,375],dot:[1973,433]},
 {no:10,name:'Remote Site',re:/remote/i,box:[1787,32,1993,71],dot:[2031,82]}];
const mnorm=s=>String(s??'').replace(/[.\s]/g,'');
const MCATS=[
 {id:'generator',nm:'Generator + ATS',sh:'Generator',unit:'เครื่อง'},
 {id:'loadcenter',nm:'Load Center',sh:'Load Center',unit:'ตู้'},
 {id:'ups',tab:'UPS',ic:'ups',nm:'UPS',sh:'UPS',unit:'เครื่อง'},
 {id:'ups',tab:'STS',ic:'sts',nm:'STS',sh:'STS',unit:'ชุด'},
 {id:'lighting',nm:'แสงสว่าง',sh:'แสงสว่าง',unit:'รายการ'},
 {id:'emergency',nm:'ไฟฉุกเฉิน',sh:'ไฟฉุกเฉิน',unit:'ดวง'}];
const mst=s=>s.bad?'bd':s.wn?'wn':s.n?'ok':'off';
const mtx=(b,w,n)=>b?`${f0(b)} เร่งด่วน`+(w?` ${f0(w)} เฝ้าระวัง`:''):w?`${f0(w)} เฝ้าระวัง`:n?'ปกติ':'ไม่มีข้อมูล';
const mcls=s=>s.bad?'t-bd':s.wn?'t-wn':'';

function mapData(){
 const blank=()=>({n:0,bad:0,wn:0,cnt:MCATS.map(()=>({n:0,bad:0,wn:0})),items:[],rooms:new Map()});
 const sites=MSITES.map(s=>({id:String(s.no),no:s.no,name:s.name,box:s.box,dot:s.dot,test:raw=>s.re.test(mnorm(raw)),...blank()})),others=new Map();
 CATS.forEach(c=>{const K=LOC[c.id];DATA[c.id].forEach(r=>{
  const raw=nz(r[K[0]]),k=mnorm(raw);
  let s=sites.find(x=>x.test(raw));
  if(!s){s=others.get(k);if(!s)others.set(k,s={id:'o:'+k,no:null,name:raw||'(ไม่ระบุสถานที่)',test:v=>mnorm(v)===k,...blank()})}
  const mi=MCATS.findIndex(m=>m.id===c.id&&(!m.tab||m.tab===kindOf(r))),cc=s.cnt[mi];
  cc.n++;s.n++;
  const al=alerts(c.id,r);
  if(al.length){let w='wn';al.forEach(t=>{if(hClass(c.id,t)[1]==='bd')w='bd'});
   if(w==='bd'){cc.bad++;s.bad++}else{cc.wn++;s.wn++}
   s.items.push({c,r,w,t:al})}
  const fl=K[1]?nz(r[K[1]]):'',rm=K[2]?nz(r[K[2]]):'',lb=[fl?'ชั้น '+fl:'',rm].filter(Boolean).join(' ')||'(ไม่ระบุชั้นหรือห้อง)';
  let ro=s.rooms.get(lb);if(!ro)s.rooms.set(lb,ro={lb,fl,rm,cnt:MCATS.map(()=>0)});ro.cnt[mi]++})});
 return{sites,others:[...others.values()].sort((a,b)=>b.n-a.n)}}

const pinHtml=s=>{const[x0,y0,x1,y1]=s.box,P=(v,t)=>(v/t*100).toFixed(3)+'%',pad=3;
 return `<button class="pin" data-site="${s.id}" style="left:${P(x0-pad,MW)};top:${P(y0-pad,MH)};width:${P(x1-x0+2*pad,MW)};height:${P(y1-y0+2*pad,MH)}"><span class="bdg off"></span></button><i class="tg" data-tg="${s.id}" style="left:${P(s.dot[0],MW)};top:${P(s.dot[1],MH)}"></i>`};

function mpPanel(s){
 const head=`<div class="mph">${s.no?`<span class="nb">${s.no}</span>`:''}<h3>${esc(s.name)}</h3><span class="mps"><i class="lamp ${mst(s)}" aria-hidden="true"></i><span class="${mcls(s)}">${mtx(s.bad,s.wn,s.n)}</span></span><button class="go" data-mclose>ปิด</button></div>`;
 if(!s.n)return `<section class="pn">${head}<p class="em">ยังไม่มีอุปกรณ์ที่บันทึกสถานที่นี้ไว้ในระบบ</p></section>`;
 const nc=s.cnt.filter(c=>c.n).length,
 rows=MCATS.map((m,i)=>{const c=s.cnt[i];
  if(!c.n)return `<li class="mr0"><span class="mrn">${ico(m.ic||m.id)}${esc(m.nm)}</span><span class="mrc">ไม่มี</span></li>`;
  return `<li><button class="mrow" data-mgo="${m.id}" data-site="${esc(s.id)}"${m.tab?` data-tab="${m.tab}"`:''}><span class="mrn">${ico(m.ic||m.id)}${esc(m.nm)}</span><span class="mrc">${f0(c.n)} ${m.unit}</span><span class="mrs"><i class="lamp ${mst(c)}" aria-hidden="true"></i><span class="${mcls(c)}">${mtx(c.bad,c.wn,c.n)}</span></span><span class="mro">เปิดดู</span></button></li>`}).join(''),
 its=s.items.slice().sort((a,b)=>(a.w==='bd'?0:1)-(b.w==='bd'?0:1)),
 al=its.length?`<ul class="mpl">`+its.slice(0,6).map(it=>{const[a,b]=hLbl(it.c,it.r);
   return `<li><button class="wi" data-hid="${esc(it.r._id)}" data-c="${it.c.id}" data-site="${esc(s.id)}"><span class="l1">${esc(a)}</span><span class="l2">${esc(it.c.name+(b?' '+b:''))}</span><span class="l3 t-${it.w}">${esc(it.t.slice(0,2).join(' / '))}</span></button></li>`}).join('')+`</ul>`+(its.length>6?`<p class="mu">และอีก ${f0(its.length-6)} รายการ เปิดดูในหมวดที่เกี่ยวข้อง</p>`:''):`<p class="em">ไม่มีรายการที่ต้องดูแลในสถานที่นี้</p>`,
 R=[...s.rooms.values()].sort((a,b)=>nat(a.fl,b.fl)||nat(a.rm,b.rm)),
 rm=`<ul class="mpl">`+R.slice(0,10).map(r=>`<li class="mrm"><span class="mrl">${esc(r.lb)}</span><span class="mrh">${r.cnt.map((n,i)=>n?`<span class="ch">${esc(MCATS[i].sh)} ${f0(n)}</span>`:'').join('')}</span></li>`).join('')+`</ul>`+(R.length>10?`<p class="mu">และอีก ${f0(R.length-10)} ชั้นหรือห้อง</p>`:'');
 return `<section class="pn">${head}<p class="sb">มีอุปกรณ์ ${f0(s.n)} รายการใน ${nc} หมวด${s.no?` ตำแหน่งหมายเลข ${s.no} บนแผนที่`:' สถานที่นี้ยังไม่มีตำแหน่งบนแผนที่'}</p><div class="mpg"><div class="mpc"><h4>อุปกรณ์ในสถานที่นี้</h4><ul class="mpl">${rows}</ul></div><div class="mpc"><h4>รายการที่ต้องดูแล</h4>${al}<h4>ชั้นและห้อง</h4>${rm}</div></div></section>`}

function mpTable(D){
 const all=[...D.sites,...D.others],
 row=s=>`<tr data-site="${esc(s.id)}"${s.id===MSEL?' class="sel"':''}><td><button class="mnb" data-site="${esc(s.id)}">${s.no?`<span class="nb">${s.no}</span>`:'<span class="nb x"></span>'}${esc(s.name)}</button></td>`+s.cnt.map(c=>`<td class="c${c.n?'':' mu'}">${c.n?f0(c.n):'-'}</td>`).join('')+`<td class="st"><i class="lamp ${mst(s)}" aria-hidden="true"></i><span class="${mcls(s)||'mu'}">${mtx(s.bad,s.wn,s.n)}</span></td></tr>`,
 T={n:0,bad:0,wn:0,cnt:MCATS.map((m,i)=>all.reduce((a,s)=>a+s.cnt[i].n,0))};all.forEach(s=>{T.n+=s.n;T.bad+=s.bad;T.wn+=s.wn});
 return `<section class="pn"><h3 style="margin:0;font-size:16.5px">อุปกรณ์แยกตามสถานที่</h3><p class="sb">จำนวนรายการในแต่ละหมวด กดชื่อสถานที่เพื่อดูรายละเอียด</p><div class="tw"><table class="mt"><thead><tr><th>สถานที่</th>${MCATS.map(m=>`<th class="c">${esc(m.sh)}</th>`).join('')}<th>สถานะ</th></tr></thead><tbody>`+
  D.sites.map(row).join('')+(D.others.length?`<tr class="sh"><td colspan="${MCATS.length+2}">สถานที่ที่ไม่อยู่ในแผนที่นี้</td></tr>`+D.others.map(row).join(''):'')+
  `<tr class="tot"><td>รวมทั้งหมด</td>${T.cnt.map(n=>`<td class="c">${f0(n)}</td>`).join('')}<td class="st"><span class="${mcls(T)||'mu'}">${mtx(T.bad,T.wn,T.n)}</span></td></tr></tbody></table></div>`+
  `<p class="mn2">ชื่อ LLZ ในข้อมูลเดิมนับเป็น LOC และ GS นับเป็น GP ตามป้ายบนแผนที่ รายการที่ไม่ได้ระบุสถานที่แสดงในกลุ่มด้านล่าง</p></section>`}

function renderMap(){
 const D=mapData(),all=[...D.sites,...D.others],ld=db&&!LOADED,f=$('#mapf');MD=D;
 if(MSEL&&!all.some(s=>s.id===MSEL))MSEL=null;
 if(!f.dataset.ready){f.dataset.ready='1';f.insertAdjacentHTML('beforeend',D.sites.map(pinHtml).join(''))}
 f.querySelectorAll('.pin').forEach(p=>{const s=D.sites.find(x=>x.id===p.dataset.site),b=p.firstChild,st=ld?'off':mst(s),
   tp=ld?'กำลังโหลดข้อมูล':`${f0(s.n)} รายการ ${mtx(s.bad,s.wn,s.n)}`;
  b.className="bdg "+st;b.textContent=st==='bd'?s.bad:st==='wn'?s.wn:st==='ok'?'✓':'';
  p.title=`${s.no} ${s.name}: ${tp}`;p.setAttribute('aria-label',`${s.name} ${tp}`);p.classList.toggle('on',s.id===MSEL)});
 f.querySelectorAll('.tg').forEach(t=>t.classList.toggle('on',t.dataset.tg===MSEL));
 const sel=all.find(s=>s.id===MSEL),p=ld?'<div class="hl">กำลังโหลดข้อมูล…</div>':sel?mpPanel(sel):'',t=ld?'':mpTable(D);
 if(p!==mapSig.p){mapSig.p=p;$('#mapp').innerHTML=p}
 if(t!==mapSig.t){mapSig.t=t;$('#mapt').innerHTML=t}}

$('#mapv').onclick=e=>{
 const t=e.target.closest('[data-site],[data-mgo],[data-mclose],[data-hid]');if(!t)return;
 const d=t.dataset,all=MD?[...MD.sites,...MD.others]:[],S=id=>all.find(s=>s.id===id),F=s=>s?{name:s.name,test:s.test}:null;
 if('mclose' in d){MSEL=null;renderMap();return}
 if(d.mgo){goCat(d.mgo,false,d.tab,F(S(d.site)));scrollTo(0,0);return}          // เปิดหมวด กรองเฉพาะสถานที่
 if(d.hid){SITEF=F(S(d.site));cat=CATS.find(x=>x.id===d.c);onlyAl=false;showSum=false;$('#q').value='';render();openForm(d.hid);return}
 MSEL=d.site;renderMap();
 const calm=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',
  w=$('#mapw'),p=[...$('#mapf').querySelectorAll('.pin')].find(x=>x.dataset.site===MSEL);
 if(p&&w.scrollWidth>w.clientWidth)w.scrollTo({left:p.offsetLeft+p.offsetWidth/2-w.clientWidth/2,behavior:calm});   // จอแคบ: เลื่อนแผนที่ให้จุดอยู่กลาง
 const pn=$('#mapp');if(pn&&pn.scrollIntoView)pn.scrollIntoView({behavior:calm,block:'nearest'})};
$('#sitex').onclick=()=>{SITEF=null;render()};

render();init();
</script>
</body>
</html>
