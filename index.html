 d._ph=editing.ph;d._by=me;if(cat.id==='loadcenter')d._ck=editing.ck.filter(c=>c.no||c.amp||c.load);d._upd=Date.now();d._o=editing.o??Date.now();
 const id=editing.id||'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
 try{const K=LOC[cat.id];await ensurePlace(d[K[0]],K[1]?d[K[1]]:'',K[2]?d[K[2]]:'');if(cat.id==='loadcenter'&&d.f4)await addLine(nz(d.f4));if(db)await db.collection(cat.id).doc(id).set(d);else{const a=DATA[cat.id],i=a.findIndex(z=>z._id===id);i<0?a.push({...d,_id:id}):a[i]={...d,_id:id}}$('#ov').hidden=true;render()}catch(e){if(sb){sb.disabled=false;sb.textContent='บันทึก'}say('บันทึกไม่สำเร็จ: '+errTx(e))}
}
async function del(){
 if(!await ok('ลบรายการนี้?'))return;
 try{if(db)await db.collection(cat.id).doc(editing.id).delete();else DATA[cat.id]=DATA[cat.id].filter(z=>z._id!==editing.id);$('#ov').hidden=true;render()}catch(e){say('ลบไม่สำเร็จ: '+errTx(e))}
}
const SN=s=>s.replace(/[\\\/\?\*\[\]:]/g,'-').slice(0,31),D8=()=>new Date().toISOString().slice(0,10);
function addCat(wb,c){
 const f=c.fields,rs=sorted(c.id),ap=(n,a)=>{if(a.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(a),SN(n))};
 ap(c.name,rs.map((r,i)=>{const o={'ลำดับ':i+1};f.forEach(x=>o[x.l]=r[x.k]??'');
  if(c.id==='loadcenter'){o['ช่องใช้งาน']=ckU(r);o['ช่องคงเหลือ']=(+r.f9||0)-ckU(r)}
  o['ความครบถ้วน (%)']=compl(c.id,r);o['แจ้งเตือน']=alerts(c.id,r).join(', ');o['จำนวนรูป']=(r._ph||[]).length;o['แก้ไขล่าสุด']=r._upd?new Date(r._upd).toLocaleString('th-TH'):'';o['ผู้แก้ไข']=r._by||'';return o}));
 if(!rs.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([f.map(x=>x.l)]),SN(c.name));
 if(c.id==='loadcenter')ap('LoadCenter_ช่อง',rs.flatMap(r=>(r._ck||[]).map(k=>({'อาคาร':r.f1,'ชั้น':r.f2,'สถานที่':r.f3,'Line':r.f4,'ชื่อตู้':r.f5,'ช่อง':k.no,'CB (A)':k.amp,'โพล':k.pole,'จ่ายให้':k.load,'สถานะ':k.st}))));
 if(c.id==='lighting'){const t={};rs.forEach(r=>{const k=r.type||'ไม่ระบุ';t[k]=(t[k]||0)+(+r.qty||0)});ap('แสงสว่าง_ชนิดหลอด',Object.entries(t).map(([a,b])=>({'ชนิดหลอด':a,'รวม (หลอด)':b})))}
 if(c.id==='generator'){ap('Generator_ไส้กรอง',gfil(rs));ap('Generator_พื้นที่',garea(rs))}
 ap(c.id+'_รูปถ่าย',rs.flatMap(r=>(r._ph||[]).map((u,i)=>({'รายการ':labelOf(c,r),'รูปที่':i+1,'ลิงก์':new URL(u,location.href).href}))));
}
async function saveWb(wb,fn){const data=XLSX.write(wb,{type:'array',bookType:'xlsx'});try{if(!dl)throw 0;await dl.save({filename:fn,data})}catch(e){if(e&&e.code==='declined')return;say('ส่งออกไฟล์ไม่สำเร็จ')}}
async function exportX(){const wb=XLSX.utils.book_new();addCat(wb,cat);await saveWb(wb,`Donmueang_${cat.id}_${D8()}.xlsx`)}
async function exportAll(){const wb=XLSX.utils.book_new();CATS.forEach(c=>addCat(wb,c));if(DATA.places.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(DATA.places.slice().sort((a,b)=>nat(nz(a.bld)+'|'+nz(a.flr)+'|'+nz(a.room),nz(b.bld)+'|'+nz(b.flr)+'|'+nz(b.room))).map(p=>({'อาคาร/สถานที่':p.bld,'ชั้น':p.flr,'ห้อง':p.room}))),'ข้อมูลหลัก_สถานที่');if(DATA.lines.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(DATA.lines.map(l=>({'Line':l.name}))),'ข้อมูลหลัก_Line');await saveWb(wb,`Donmueang_all_${D8()}.xlsx`)}
async function copyT(){const f=cat.fields,tx=[f.map(x=>x.l).join('\t')].concat(CUR.map(r=>f.map(x=>String(r[x.k]??'').replace(/[\t\n]/g,' ')).join('\t'))).join('\n');
 try{await navigator.clipboard.writeText(tx)}catch(e){const a=document.createElement('textarea');a.value=tx;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}
 $('#cpy').textContent='คัดลอกแล้ว ✓';setTimeout(()=>$('#cpy').textContent='คัดลอกตาราง',1500)}
async function backup(){const s=JSON.stringify({app:'atc-dmk',ver:1,at:new Date().toISOString(),data:DATA});try{if(!dl)throw 0;await dl.save({filename:`backup_${D8()}.json`,data:s})}catch(e){if(e&&e.code==='declined')return;say('บันทึกไฟล์ .json ไม่สำเร็จ — ใช้ "ส่งออกทุกหมวด" (Excel) เป็นไฟล์สำรองแทน')}}
async function restore(e){const f=e.target.files[0];if(!f)return;let j;try{j=JSON.parse(await f.text())}catch(x){say('ไฟล์ไม่ถูกต้อง');return}
 if(!j.data||!await ok('กู้คืนข้อมูลจากไฟล์นี้? รายการที่มี id เดียวกันจะถูกเขียนทับ'))return;
 let n=0;for(const cid of[...CATS.map(x=>x.id),'places','lines'])for(const r of j.data[cid]||[]){const{_id,...d}=r;try{if(db)await db.collection(cid).doc(_id).set(d);n++}catch(x){say('หยุดที่ '+n+' รายการ: '+(x.message||x.code));return}}
 say('กู้คืนแล้ว '+n+' รายการ');e.target.value=''}
$('#syn').onclick=e=>{if(e.target.closest('#who'))setMe()};
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b){cat=b.dataset.c==='master'?MASTER:CATS.find(c=>c.id===b.dataset.c);onlyAl=false;showSum=false;$('#q').value='';render()}};
$('#q').oninput=render;$('#flt').onchange=render;
$('#groups').onclick=e=>{const t=e.target.closest('tr');if(t&&t.dataset.id)openForm(t.dataset.id)};
$('#add').onclick=()=>openForm(null);$('#exp').onclick=exportX;$('#expall').onclick=exportAll;$('#cpy').onclick=copyT;$('#bk').onclick=backup;$('#rs').onchange=restore;$('#st').onclick=e=>{if(e.target.closest('[data-al]')){onlyAl=!onlyAl;render()}};
$('#sumb').onclick=()=>{showSum=!showSum;render()};
$('#md').onclick=e=>{const g=e.target.closest('[data-go]');if(g){cat=CATS.find(c=>c.id===g.dataset.c);$('#ov').hidden=true;render();openForm(g.dataset.go);return}
const u=e.target.dataset.u,d=e.target.dataset.d;if(u){$('#big').src=u;$('#iv').hidden=false}if(d!=null){editing.ph.splice(+d,1);drawPh()}};
$('#md').oninput=e=>{const w=e.target.closest('.ckr');if(w){const c=editing.ck[+w.dataset.i];c[e.target.dataset.k]=e.target.value;drawCks()}else if(e.target.id==='x_f9')drawCks();else if(e.target.dataset.lv!=null)locChange(e.target);else if(e.target.id==='x_f4'&&cat.id==='loadcenter')lineChange(e.target)};
$('#md').addEventListener('click',e=>{const x=e.target.dataset.x;if(x!=null){editing.ck.splice(+x,1);drawCk()}});
$('#groups').addEventListener('toggle',e=>{const d=e.target;if(d.classList&&d.classList.contains('grp')&&!$('#q').value&&!$('#flt').value){const s=OPEN[cat.id]||(OPEN[cat.id]=new Set());d.open?s.add(d.dataset.g):s.delete(d.dataset.g)}},true);
$('#tg').onclick=()=>{const a=[...document.querySelectorAll('.grp')],o=a.some(d=>!d.open);a.forEach(d=>d.open=o)};
$('#dgo').onclick=()=>dfin($('#dgi').hidden?true:$('#dgi').value);$('#dgc').onclick=()=>dfin($('#dgi').hidden?false:null);$('#dgi').onkeydown=e=>{if(e.key==='Enter')$('#dgo').click()};
$('#mst').addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.k){d.open?EXP.add(d.dataset.k):EXP.delete(d.dataset.k)}},true);
$('#mst').onclick=async e=>{const t=e.target.closest('[data-a]');if(!t)return;e.preventDefault();const a=t.dataset.a,lv=+t.dataset.lv,b=t.dataset.b||'',f=t.dataset.f||'',r=t.dataset.r||'';
 try{if(a==='tog'){const k=t.dataset.k;EXP.has(k)?EXP.delete(k):EXP.add(k)}
 else if(a==='go'){cat=CATS.find(c=>c.id===t.dataset.c);render();openForm(t.dataset.id);return}
 else if(a==='seedm')await seedMaster();
 else if(a==='addb'){const n=nz(await ask('ชื่ออาคาร/สถานที่ใหม่'));if(n)await ensurePlace(n,'','')}
 else if(a==='addf'){const n=nz(await ask('ชั้นใหม่ ใน '+b));if(n)await ensurePlace(b,n,'')}
 else if(a==='addr'){const n=nz(await ask('ชื่อห้องใหม่'));if(n)await ensurePlace(b,f,n)}
 else if(a==='ren'){const old=[b,f,r][lv],n=nz(await ask('เปลี่ยนชื่อ (ตั้งซ้ำกับชื่อที่มีอยู่ = รวมเข้าด้วยกัน)',old));if(n&&n!==old)await renameLoc(lv,b,f,r,n)}
 else if(a==='del')await delLoc(lv,b,f,r);
 else if(a==='addl')await addLine(nz(await ask('ชื่อ Line ใหม่ (เช่น Normal, UPS, Gen)')));
 else if(a==='renl'){const n=nz(await ask('เปลี่ยนชื่อ Line',b));if(n&&n!==b)await renameLine(b,n)}
 else if(a==='dell')await delLine(b)}catch(x){say('ไม่สำเร็จ: '+(x.message||x.code||x))}
 note('');render()};
$('#iv').onclick=()=>$('#iv').hidden=true;
$('#ov').onclick=e=>{if(e.target.id==='ov')$('#ov').hidden=true};
render();init();
</script>
